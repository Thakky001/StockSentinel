# =============================================================================
# Render Blueprint Specification for StockSentinel
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================

version: "1"

services:
  # ---------------------------------------------------------------------------
  # 1. Main Full-Stack Web Service (React Frontend + Express REST API)
  # ---------------------------------------------------------------------------
  - type: web
    name: stocksentinel-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      # Connect automatically to Render PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: stocksentinel-db
          property: connectionString
      # Telegram Bot Notifications (Configure in Render Dashboard if used)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: APP_BASE_URL
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Automated Weekly Screener Cron Job
  # Runs every Saturday 06:00 BKK time (Friday 23:00 UTC) after US market close
  # ---------------------------------------------------------------------------
  - type: cron
    name: stocksentinel-screener-cron
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m screener.src.main --mode all
    schedule: "0 23 * * 5" # Friday 23:00 UTC = Saturday 06:00 AM Bangkok (ICT)
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stocksentinel-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: APP_BASE_URL
        sync: false

databases:
  # ---------------------------------------------------------------------------
  # 3. Managed PostgreSQL Database
  # ---------------------------------------------------------------------------
  - name: stocksentinel-db
    databaseName: stocksentinel
    user: postgres
    plan: free
    region: singapore
    postgresMajorVersion: "16"
