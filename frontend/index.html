<!doctype html>
<html lang="th" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StockSentinel – ระบบสแกนและวิเคราะห์หุ้นอัตโนมัติ ตามหลักการ Stan Weinstein Stage 2" />
    <title>StockSentinel - ระบบสแกนหุ้น Stan Weinstein Stage 2</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0f172a;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
      }
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #0f172a;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(59, 130, 246, 0.2);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-100">
    <div id="root">
      <div class="initial-loader">
        <div class="spinner"></div>
        <p style="color: #94a3b8; font-size: 14px; margin: 0;">กำลังเปิดระบบ StockSentinel...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
