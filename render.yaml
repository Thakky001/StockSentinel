# =============================================================================
# Render Blueprint Specification for StockSentinel (Free Tier Compatible)
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================

version: "1"

services:
  # ---------------------------------------------------------------------------
  # 1. Main Full-Stack Web Service (React Frontend + Express REST API)
  # ---------------------------------------------------------------------------
  - type: web
    name: stocksentinel-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      # Connect automatically to Render PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: stocksentinel-db
          property: connectionString
      # Telegram Bot Notifications (Configure in Render Dashboard if used)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: APP_BASE_URL
        sync: false

databases:
  # ---------------------------------------------------------------------------
  # 2. Managed PostgreSQL Database (Free Tier)
  # ---------------------------------------------------------------------------
  - name: stocksentinel-db
    databaseName: stocksentinel
    plan: free
    region: singapore
    postgresMajorVersion: "16"

